name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Inside $GITHUB_WORKSPACE (actions/checkout refuses a `path:`
      # outside it — see rathnasgala2/publish#run 35724753393), under
      # `.siblings/` so publish's own format:check/lint gates (the only
      # gates that scan this repository recursively from its root; see
      # .prettierignore and eslint.config.js) can ignore that one
      # directory instead. architecture/duplication/test are already
      # scoped to packages/ and test/, so they never see it.
      WORKSPACE_ROOT: ${{ github.workspace }}/.siblings
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # PLACEHOLDER (W0-01): ref is provisional until the template
      # repository exists on GitHub with a frozen contract revision to
      # pin to. packages/publish-action's template-bridge.js (TEMPLATE_ROOT)
      # needs this checkout by path, and its own dependencies installed,
      # for the S2-T20/S2-T20b build/publish tests `npm test` runs.
      # `path: .siblings/template` (inside $GITHUB_WORKSPACE, matching
      # WORKSPACE_ROOT above) is required by actions/checkout; it is kept
      # out of publish's own recursive lint/format scans via
      # .prettierignore/eslint.config.js instead.
      - name: Check out the template sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/template
          ref: main # PLACEHOLDER (W0-01): pin to a frozen release tag
          path: .siblings/template
          persist-credentials: false

      # PLACEHOLDER (W0-01): ref is provisional until the theme-default
      # repository exists on GitHub with a frozen release to pin to.
      # packages/publish-action's theme-bridge.js (LOCAL-only sibling
      # fallback step) needs this checkout by path for the same tests.
      - name: Check out the theme-default sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/theme-default
          ref: main # PLACEHOLDER (W0-01): pin to a frozen release tag
          path: .siblings/theme-default
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Install the template sibling's own dependencies
        working-directory: .siblings/template
        run: npm ci

      - name: Run repository gates
        run: npm run verify

      - name: Verify workflow pin discipline
        run: npm run workflows:check

      - name: Check gitleaks fragment drift (infra sibling optional)
        run: npm run workflows:drift

      - name: Install the checksum-pinned Gitleaks binary
        shell: bash
        run: |
          install -d "${RUNNER_TEMP}/gitleaks"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "${RUNNER_TEMP}/gitleaks/gitleaks.tar.gz"
          cd "${RUNNER_TEMP}/gitleaks"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            'gitleaks.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks

      - name: Scan repository history for secrets
        run: >-
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --no-banner
          --log-opts="--all" .
