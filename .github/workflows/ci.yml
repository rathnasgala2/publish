name: CI

# Fast, per-push gate: does THIS commit look broken? format:check, lint,
# typecheck, workflow-pin discipline, the gitleaks-fragment drift check, the
# npm dependency audit, the gitleaks secret-history scan and the unit test
# suites (everything under test/ except sandbox.test.mjs, the Docker-based
# build-sandbox proof) run here as independent parallel jobs, so wall clock
# is the slowest single job rather than their sum. The audit and gitleaks
# jobs are security gates and stay on every push even though the rest of
# the quality/supply-chain job moved to nightly (LOCAL-67 adversarial
# review): a vulnerable dependency or a leaked secret must not sit on main
# for up to 24h.
#
# PUB-M1: the fast jobs above are a strict subset of `npm run verify`, so a
# merged PR could violate the dependency-cruiser adapter-isolation gate, the
# pin ledger, the SBOM or any other gate that only ran nightly and sit on
# `main` for up to 24h. The `full-verify` job below runs the complete,
# unabridged `npm run verify` (every one of the twelve gates the workspace
# root README enumerates, plus the license/provenance/declarations/manifest/
# changelog gates added since) on every push and pull request too, so a
# merge can no longer land in a state nightly.yml would have caught first.
# It is slower than the fast jobs above (it includes the Docker build-sandbox
# proof); that is an accepted per-push cost for closing the gap. nightly.yml
# is kept as a scheduled catch for drift that lands with no push to this
# repository (e.g. a transitive advisory published against an already-merged
# lockfile) and for the gitleaks full-history scan.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  workflow-checks:
    name: Workflow pins & gitleaks-fragment drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify workflow pin discipline
        run: npm run workflows:check
      - name: Check gitleaks fragment drift (infra sibling optional)
        run: npm run workflows:drift

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Inside $GITHUB_WORKSPACE (actions/checkout refuses a `path:`
      # outside it — see rathnasgala2/publish#run 35724753393), under
      # `.siblings/` so publish's own format:check/lint gates (the only
      # gates that scan this repository recursively from its root; see
      # .prettierignore and eslint.config.js) can ignore that one
      # directory instead.
      WORKSPACE_ROOT: ${{ github.workspace }}/.siblings
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # packages/publish-action's template-bridge.js (TEMPLATE_ROOT) needs
      # this checkout by path, and its own dependencies installed, for the
      # S2-T20/S2-T20b build/publish tests `npm test` runs. Pinned to the
      # commit published as template 2.1.0 (PUB-H5 pin bump, theme-default
      # 2.1.0 cut against it) rather than a mutable `main`, so a push to the
      # sibling repository cannot silently change what this job tests against.
      - name: Check out the template sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/template
          ref: 20f8fdefe822f264f9d7fdd787d0d58431930a0b
          path: .siblings/template
          persist-credentials: false

      # packages/publish-action's theme-bridge.js (LOCAL-only sibling
      # fallback step) needs this checkout by path for the same tests.
      # Pinned to the commit published as theme-default 2.1.0 (PUB-H5 pin
      # bump, cut against template 2.1.0), rather than a mutable `main`.
      - name: Check out the theme-default sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/theme-default
          ref: b8015f166ef62c73e3096dab9bb74648a701d85e
          path: .siblings/theme-default
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Install the template sibling's own dependencies
        working-directory: .siblings/template
        run: npm ci --ignore-scripts

      - name:
          Run unit tests (workspaces + repo-level, excluding the Docker sandbox
          proof)
        run: npm run test:unit

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run audit

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the checksum-pinned Gitleaks binary
        shell: bash
        run: |
          install -d "${RUNNER_TEMP}/gitleaks"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "${RUNNER_TEMP}/gitleaks/gitleaks.tar.gz"
          cd "${RUNNER_TEMP}/gitleaks"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            'gitleaks.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks

      - name: Scan repository history for secrets
        run: >-
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --no-banner
          --log-opts="--all" .

  full-verify:
    name: Full verify (PUB-M1)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WORKSPACE_ROOT: ${{ github.workspace }}/.siblings
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out the template sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/template
          ref: 20f8fdefe822f264f9d7fdd787d0d58431930a0b
          path: .siblings/template
          persist-credentials: false

      - name: Check out the theme-default sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/theme-default
          ref: b8015f166ef62c73e3096dab9bb74648a701d85e
          path: .siblings/theme-default
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install the template sibling's own dependencies
        working-directory: .siblings/template
        run: npm ci --ignore-scripts

      - name: Run the complete repository gate
        run: npm run verify
