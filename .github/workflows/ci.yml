name: CI

# Fast, per-push gate: does THIS commit look broken? format:check, lint,
# typecheck, workflow-pin discipline, the gitleaks-fragment drift check, the
# npm dependency audit, the gitleaks secret-history scan and the unit test
# suites (everything under test/ except sandbox.test.mjs, the Docker-based
# build-sandbox proof) run here as independent parallel jobs, so wall clock
# is the slowest single job rather than their sum. The audit and gitleaks
# jobs are security gates and stay on every push even though the rest of
# the quality/supply-chain job moved to nightly (LOCAL-67 adversarial
# review): a vulnerable dependency or a leaked secret must not sit on main
# for up to 24h.
#
# The build sandbox (test/sandbox.test.mjs, scripts/sandbox-build.sh) stays
# out of this fast gate on purpose: each of its cases pulls/builds a
# container image and runs it under `--network none` with dropped
# capabilities, which is inherently a tens-of-seconds-per-case operation,
# not a per-push budget item, even though it proves a core security
# property (S4-T07 — untrusted author build code cannot see the network,
# mutate the source tree or escape its resource limits). It still runs
# every night in nightly.yml as part of the complete `npm run verify`.
#
# Everything else that was in the single "Quality and supply chain" job --
# architecture (dependency-cruiser), duplication (jscpd), the full test
# suite including the sandbox and sbom:check -- also moved to nightly.yml,
# unchanged in substance.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  workflow-checks:
    name: Workflow pins & gitleaks-fragment drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify workflow pin discipline
        run: npm run workflows:check
      - name: Check gitleaks fragment drift (infra sibling optional)
        run: npm run workflows:drift

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Inside $GITHUB_WORKSPACE (actions/checkout refuses a `path:`
      # outside it — see rathnasgala2/publish#run 35724753393), under
      # `.siblings/` so publish's own format:check/lint gates (the only
      # gates that scan this repository recursively from its root; see
      # .prettierignore and eslint.config.js) can ignore that one
      # directory instead.
      WORKSPACE_ROOT: ${{ github.workspace }}/.siblings
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # packages/publish-action's template-bridge.js (TEMPLATE_ROOT) needs
      # this checkout by path, and its own dependencies installed, for the
      # S2-T20/S2-T20b build/publish tests `npm test` runs. Pinned to the
      # commit the themes use for 2.0.0 (S6-T01 schema re-pin to registry
      # 2.11.0) rather than a mutable `main`, so a push to the sibling
      # repository cannot silently change what this job tests against.
      - name: Check out the template sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/template
          ref: 15142f8baebaff5e174ac07d784073d2d2163b88
          path: .siblings/template
          persist-credentials: false

      # packages/publish-action's theme-bridge.js (LOCAL-only sibling
      # fallback step) needs this checkout by path for the same tests.
      # Pinned to the commit reviewed in the 2026-09-25 code-discipline
      # review (rathnasgala2/theme-default), rather than a mutable `main`.
      - name: Check out the theme-default sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/theme-default
          ref: 50957da66db16bb3b735eb2cd0b6a7f78e29b739
          path: .siblings/theme-default
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Install the template sibling's own dependencies
        working-directory: .siblings/template
        run: npm ci --ignore-scripts

      - name:
          Run unit tests (workspaces + repo-level, excluding the Docker sandbox
          proof)
        run: npm run test:unit

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run audit

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the checksum-pinned Gitleaks binary
        shell: bash
        run: |
          install -d "${RUNNER_TEMP}/gitleaks"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "${RUNNER_TEMP}/gitleaks/gitleaks.tar.gz"
          cd "${RUNNER_TEMP}/gitleaks"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            'gitleaks.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks

      - name: Scan repository history for secrets
        run: >-
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --no-banner
          --log-opts="--all" .
