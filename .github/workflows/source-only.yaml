name: Source-only verification

# Read-only: the complete repository gate (`npm run verify`) on main, with no
# npm credentials. Publishing is `release.yaml`, the only workflow that
# publishes to npm.

on:
  push:
    branches:
      - main
    paths:
      - packages/**
      - package.json
      - package-lock.json
      - scripts/**
      - pins/**
      - .github/workflows/source-only.yaml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: source-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source-only inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WORKSPACE_ROOT: ${{ github.workspace }}/node_modules/@rathnasgala2
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the user template at its pinned commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/user-template
          ref: 2b33ebce1bff540f7ef9c27a99d59f3e478c0111
          path: .siblings/user-template
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete release gate
        run: npm run verify
