name: Nightly

# The complete gate, once a day: everything that used to run on every push
# in the single "Quality and supply chain" job, unchanged in substance --
# `npm run verify` (format, lint, typecheck, architecture, duplication, the
# full test suite including the Docker build-sandbox proof, sbom:check,
# audit), the workflow-pin check and the gitleaks-fragment drift check, and
# the gitleaks secret scan itself. ci.yml now also runs the complete
# `npm run verify` on every push and pull request (PUB-M1's full-verify job),
# so this workflow's `quality` job is now belt-and-braces for drift with no
# push to this repository. A separate `spaces-minio-conformance` job
# (PUB-M10) runs adapter-do-spaces's real-server conformance suite against a
# throwaway, digest-pinned MinIO container -- CI otherwise only ever proves
# that adapter against a fake S3 server written by the same authors.
on:
  schedule:
    # 03:47 UTC: staggered ~30 minutes after infra's nightly run (03:17 UTC)
    # so the two repositories' nightly jobs don't contend for the same
    # scheduling slot, and outside the top-of-hour crowd.
    - cron: '47 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality and supply chain (complete)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Inside $GITHUB_WORKSPACE, under `.siblings/` — mirrors ci.yml
      # (actions/checkout refuses a `path:` outside $GITHUB_WORKSPACE).
      WORKSPACE_ROOT: ${{ github.workspace }}/.siblings
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # packages/publish-action's template-bridge.js (TEMPLATE_ROOT) needs
      # this checkout by path, and its own dependencies installed, for the
      # S2-T20/S2-T20b build/publish tests `npm test` runs. Pinned to the
      # commit the themes use for 2.0.0 (S6-T01 schema re-pin to registry
      # 2.11.0) rather than a mutable `main`, so a push to the sibling
      # repository cannot silently change what this job tests against.
      - name: Check out the template sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/template
          ref: 15142f8baebaff5e174ac07d784073d2d2163b88
          path: .siblings/template
          persist-credentials: false

      # packages/publish-action's theme-bridge.js (LOCAL-only sibling
      # fallback step) needs this checkout by path for the same tests.
      # Pinned to the commit reviewed in the 2026-09-25 code-discipline
      # review (rathnasgala2/theme-default), rather than a mutable `main`.
      - name: Check out the theme-default sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/theme-default
          ref: 50957da66db16bb3b735eb2cd0b6a7f78e29b739
          path: .siblings/theme-default
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Install the template sibling's own dependencies
        working-directory: .siblings/template
        run: npm ci --ignore-scripts

      - name: Run the complete repository gate
        run: npm run verify

      - name: Verify workflow pin discipline
        run: npm run workflows:check

      - name: Check gitleaks fragment drift (infra sibling optional)
        run: npm run workflows:drift

      - name: Install the checksum-pinned Gitleaks binary
        shell: bash
        run: |
          install -d "${RUNNER_TEMP}/gitleaks"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "${RUNNER_TEMP}/gitleaks/gitleaks.tar.gz"
          cd "${RUNNER_TEMP}/gitleaks"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            'gitleaks.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks

      - name: Scan repository history for secrets
        run: >-
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --no-banner
          --log-opts="--all" .

  spaces-minio-conformance:
    name: adapter-do-spaces MinIO conformance (PUB-M10)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Without this job, adapter-do-spaces is validated in CI only against
      # test/fake-s3-server.js, a fake written by the same authors as the
      # adapter -- any shared misunderstanding of S3 semantics (conditional
      # PUT behaviour, ETag quoting, error codes, SigV4 canonicalisation
      # edge cases) is invisible. This runs the identical conformance
      # fixture against a real, throwaway, digest-pinned MinIO server.
      - name: Start the throwaway MinIO server
        run: |
          endpoint_assignment="$(scripts/minio-spaces.sh up)"
          echo "${endpoint_assignment}" >> "${GITHUB_ENV}"

      - name: Run adapter-do-spaces against real MinIO
        run: npm test --workspace packages/adapter-do-spaces

      - name: Remove the throwaway MinIO server
        if: always()
        run: scripts/minio-spaces.sh down
