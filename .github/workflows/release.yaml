name: Release

# The only workflow in this repository that publishes to npm: the adapter family
# (adapter-protocol, adapter-local-directory, adapter-github-pages,
# adapter-do-spaces; adapter-conformance-kit is private and never published).
# Like the template, schemas and theme repositories, it is named `release.yaml`
# and uses npm trusted publishing: `environment: npm`, `id-token: write`,
# provenance, and no NPM_TOKEN secret. `source-only.yaml` is the read-only
# verification of main; it publishes nothing.
#
# A release is: bump the package's version and CHANGELOG, push to main. A push
# that changes a packed path (src/, types/, README.md, CHANGELOG.md, LICENSE or
# package.json) of a package whose declared version is already on npm FAILS; it
# never skips silently, and it publishes nothing from that push. Before
# anything is published the complete repository gate (`npm run verify`, which
# includes the CHANGELOG-heading check) must pass once, and each package then
# passes its own typecheck, declarations and tests. A manual run
# (workflow_dispatch) releases the one package it names, e.g. to retry after
# the trusted publisher was registered late.
#
# Publishing is step two of an adapter release. Read "Releasing an adapter" in
# README.md, in order: the catalog commit FIRST (update-adapter-catalog.mjs with
# the SHA-256 of the local pack, the admission row, sbom and CHANGELOG, in one
# commit with the version bump, because the gate below proves the catalog equals
# that pack), then this workflow, then the API catalog + admission migration +
# deploy, then user-template. prod-adapter.sh at the workspace root is for
# emergencies only.
#
# One-time owner setup on npmjs.com, per package (Settings > Trusted
# publishing > GitHub Actions): owner rathnasgala2, repository publish,
# workflow filename release.yaml, environment npm.

on:
  push:
    branches:
      - main
    paths:
      - packages/adapter-protocol/**
      - packages/adapter-local-directory/**
      - packages/adapter-github-pages/**
      - packages/adapter-do-spaces/**
  workflow_dispatch:
    inputs:
      package:
        description:
          The adapter package to release (its declared version must be new on
          npm)
        required: true
        type: choice
        options:
          - adapter-protocol
          - adapter-local-directory
          - adapter-github-pages
          - adapter-do-spaces

permissions:
  contents: read

jobs:
  plan:
    name: Select the packages to release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Verify toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      # Fails the run when a packed path changed in a package whose declared
      # version is already on npm, or is not newer than the newest published
      # version. See scripts/release/adapter-release.mjs.
      - name: Select the adapter packages whose version is new on npm
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: node scripts/release/adapter-release.mjs plan

  # The complete repository gate, once per run (not once per package), before
  # any package is published. It holds no npm credentials: no environment and
  # no id-token permission. The user-template ref below moves together with the
  # ones in ci.yml and source-only.yaml (README.md, "Releasing an adapter").
  verify:
    name: Run the complete repository gate
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WORKSPACE_ROOT: ${{ github.workspace }}/node_modules/@rathnasgala2
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out the user template at its pinned commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/user-template
          ref: c57ffaff880f6761b2cbf34751cee2f44b76f464
          path: .siblings/user-template
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run the complete release gate
        run: npm run verify

  publish:
    name: Validate and publish ${{ matrix.package }}
    needs:
      - plan
      - verify
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    concurrency:
      group: release-adapter-${{ matrix.package }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    strategy:
      # One package at a time in dependency order (the protocol first); a
      # failure stops the packages that have not started.
      fail-fast: true
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Read the declared package identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          manifest="packages/${PACKAGE}/package.json"
          package_name="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).name" "${manifest}")"
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).version" "${manifest}")"
          echo "name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

      # Runs after any wait behind an earlier run of the same package (the
      # concurrency group above), so it sees what that run published.
      - name: Fail unless this version is new on npm
        run:
          node scripts/release/adapter-release.mjs check "packages/${PACKAGE}"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck the package
        run: npm --workspace "packages/${PACKAGE}" run typecheck

      - name: Check the committed declarations
        run: npm --workspace "packages/${PACKAGE}" run declarations:check

      - name: Run the package tests
        run: npm --workspace "packages/${PACKAGE}" run test

      - name: Verify the package payload
        run: npm pack --dry-run --workspace "packages/${PACKAGE}"

      # The digest of the reviewed bytes, compared with the registry's copy
      # after publishing.
      - name: Pack the reviewed bytes
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pack"
          tarball="$(npm pack --workspace "packages/${PACKAGE}" --pack-destination "${RUNNER_TEMP}/pack" --silent | tail -n 1)"
          pack_sha256="$(sha256sum "${RUNNER_TEMP}/pack/${tarball}" | cut -d ' ' -f 1)"
          echo "sha256=${pack_sha256}" >> "${GITHUB_OUTPUT}"

      # The first publish of a package needs the owner's npm trusted-publisher
      # setup (repository rathnasgala2/publish, workflow release.yaml,
      # environment npm). Without it this step must fail loudly, never skip.
      - name: Publish with trusted provenance
        working-directory: packages/${{ matrix.package }}
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.identity.outputs.name }}
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          test "$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")" = "${PACKAGE_NAME}"
          if ! npm publish --provenance --access public --ignore-scripts; then
            echo "::error::npm publish failed for ${PACKAGE_NAME}@${PACKAGE_VERSION}. If ${PACKAGE_NAME} has no npm trusted publisher yet, the owner must register this repository's release.yaml (owner rathnasgala2, repository publish, environment npm) for it on npmjs.com, then dispatch this workflow for ${PACKAGE}." >&2
            exit 1
          fi

      - name: Wait until the registry lists the version
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.identity.outputs.name }}
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is listed."
              exit 0
            fi
            echo "Waiting for the registry to list ${PACKAGE_NAME}@${PACKAGE_VERSION} (attempt ${attempt} of 20)."
            if [ "${attempt}" -lt 20 ]; then
              sleep 30
            fi
          done
          echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} was published but is still not listed after 10 minutes. Check npmjs.com; do not publish it again." >&2
          exit 1

      # The artifact catalog admits a release by the registry tarball's
      # SHA-256, and its row was committed from the reviewed local pack before
      # this run (the gate above proved it). Print the registry's digest and
      # refuse a mismatch with the reviewed bytes.
      - name: Record the registry digest
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.identity.outputs.name }}
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
          LOCAL_SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          url="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" dist.tarball)"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/registry.tgz" "${url}"
          registry_sha256="$(sha256sum "${RUNNER_TEMP}/registry.tgz" | cut -d ' ' -f 1)"
          {
            echo "### ${PACKAGE_NAME}@${PACKAGE_VERSION} published"
            echo
            echo "Registry tarball sha256: \`${registry_sha256}\`"
            echo
            echo "Next, in this order (README.md, \"Releasing an adapter\"):"
            if [ "${PACKAGE}" != "adapter-protocol" ]; then
              echo
              echo "1. Verify that the catalog row in \`packages/publish-action/src/adapter-artifact-catalog.js\` for ${PACKAGE_NAME}@${PACKAGE_VERSION} equals this sha256 (it was committed before this release, from the local pack)"
              echo "2. API code catalog + database admission migration + deploy"
              echo "3. user-template pin and lock"
            else
              echo
              echo "The protocol has no catalog row. Release the adapters that depend on it, then follow README.md."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${registry_sha256}" != "${LOCAL_SHA256}" ]; then
            echo "::error::The registry tarball for ${PACKAGE_NAME}@${PACKAGE_VERSION} has sha256 ${registry_sha256}, but the reviewed pack was ${LOCAL_SHA256}. Do not deploy this release: the catalog row is the reviewed pack's digest, so it does not match the registry until the difference is understood." >&2
            exit 1
          fi
          echo "Registry digest equals the reviewed pack: ${registry_sha256}"
